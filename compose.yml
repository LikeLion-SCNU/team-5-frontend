services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-8001}
    command: /bin/sh -c "envsubst '$$BACKEND_PORT' < /etc/nginx/conf.d/default.conf > /tmp/default.conf && cp /tmp/default.conf /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
