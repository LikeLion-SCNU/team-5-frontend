services:
  web:
    build: .
    restart: unless-stopped
    ports:
      # loopback에만 게시 — Caddy(host network)가 localhost:80으로 프록시하므로 정상 동작하고,
      # 외부에서 Caddy를 우회해 nginx에 직접 닿는 경로(레이트리밋 XFF 우회)를 원천 차단한다.
      - "127.0.0.1:${APP_PORT:-8080}:80"
    environment:
      BACKEND_PORT: ${BACKEND_PORT:-8001}
    command: /bin/sh -c "envsubst '$$BACKEND_PORT' < /etc/nginx/conf.d/default.conf > /tmp/default.conf && cp /tmp/default.conf /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
