server {
    listen 80;
    # 사진 업로드(식사·얼굴) 허용 한도 — 백엔드 10MB보다 약간 크게 두어
    # 초과분은 백엔드가 친절한 4xx로 응답하게 한다 (nginx 기본 1m이면 413).
    client_max_body_size 12m;
    # 백엔드 API: /api/v1/... 경로 그대로 전달 (허찬 컨트롤러 @RequestMapping("/api/v1/...") 기준)
    location /api/ {
        proxy_pass http://172.17.0.1:${BACKEND_PORT}/api/;
        proxy_set_header Host $host;
        # 백엔드의 인증 레이트리밋이 실제 클라이언트를 구분할 수 있도록 원 IP를 넘긴다.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }
    # 헬스체크 편의 경로
    location /healthz {
        proxy_pass http://172.17.0.1:${BACKEND_PORT}/actuator/health;
        proxy_set_header Host $host;
    }
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
